      <title id="mechanic-perlin-title">Perlin noise and randomness mechanic, by Wanghao Jin</title>
      <desc id="mechanic-perlin-desc">Each train line is a band of thousands of stitches and knots that weave along its track. Random, once: Each grain rolls its speed, lane, size and shape when it is born, so the weave stays stable. Perlin drift: Grains sway sideways like a slow current, but never past half the gap to the next line. Data sets the density: Busy months weave dense, bright rope; quiet months thin to dim thread. Fabric press: The hovering pointer presses a soft dent, so the threads part around it.</desc>
