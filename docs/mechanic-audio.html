      <title id="mechanic-audio-title">Audio mechanic, by Guangshun Wen</title>
      <desc id="mechanic-audio-desc">The city's sound follows the data, and the same sound moves the grains. Three city layers: A low rumble, a warm hum and bright taps play together, looped. The data mixes it: A busy month plays all three; in the lockdowns only a faint, lower rumble is left. FFT moves the grains: Bass squeezes the bands, mids shear neighbouring lines, treble makes grains shiver. Breath and clack: Loudness deepens the breathing; a departure-board clack marks each month.</desc>
