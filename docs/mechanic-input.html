      <desc id="mechanic-input-desc">The visitor's hand on the fabric, and their control of time. Works with a mouse, keys or touch. Hold to gather: Grains are drawn into the hand, stronger the closer they are. Drag to pull: The grabbed line bends like a pulled thread, then a damped spring eases it back. Click to listen: Listening mode: one line comes forward, the rest of the network fades back. Travel through time: Drag the timeline, scroll, click a year or use the arrows; playback pauses.</desc>
