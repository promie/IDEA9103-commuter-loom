<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Commuter Loom</title>
    <!-- The woven-swatch logo as the browser-tab icon. -->
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />

    <!-- Start downloading the Raleway font straight away, so the canvas
         text is ready in Raleway as soon as possible. -->
    <link rel="preload" href="assets/fonts/raleway-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" type="text/css" href="style.css" />

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
  </head>

  <body>
    <noscript>This artwork requires JavaScript to run.</noscript>

    <!-- Shared classes and data (utils) -->
    <script src="utils/colour-theme.js"></script>
    <script src="utils/logo-mark.js"></script>
    <script src="utils/network-layout.js"></script>
    <script src="utils/track-path.js"></script>
    <script src="utils/rail-network.js"></script>
    <script src="utils/trip-data.js"></script>
    <script src="utils/timeline.js"></script>
    <script src="utils/fabric-breath.js"></script>
    <script src="utils/data-panel.js"></script>
    <script src="utils/interface-overlay.js"></script>

    <!-- One file per mechanic -->
    <script src="mechanics/perlin-flow.js"></script>
    <script src="mechanics/input-controls.js"></script>
    <script src="mechanics/audio-reactive.js"></script>

    <!-- Brings everything together -->
    <script src="sketch.js"></script>
  </body>
</html>
